<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-sale=1.0">
    <link rel="stylesheet" href="styles/main.css">
</head>

<body>
    <!-- Header Section-->
    <header class="header">
        <div class="headings">
        <h1 class="project-heading-text-center">Price Range Slider</h1>
        </div>
    </header>
    <!-- Main Hero Banner -->
     <section class="hero">
        <div class="price-inputs">
            <div class="price-field">
                <span>Min Price</span>
                <input class="min-input" type="number" placeholder="0">
            </div>
            <div class="price-field">
                <span>Max Price</span>
                <input class="max-input" type="number" placeholder="100000">
            </div>
            <div class="range-slider">
            <input class="min-range" type="range" min="0" max="100000" value="0" step="1">
            <input class="max-range" type="range" min="0" max="100000" value="100000" step="1">
        </div>
        </div>  
     </section>
     <script src="styles/script.js"></script> 
</body>
</html>
